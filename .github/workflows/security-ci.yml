name: Security and build verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile with reviewed security overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist dependency lockfile changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile for audited dependency overrides"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Generate full dependency audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run unit tests when present
        shell: bash
        run: |
          if compgen -G "src/utils/*.test.ts" > /dev/null; then
            npm test
          else
            echo "No src/utils unit test files are currently defined."
          fi
