name: Security and build verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate full dependency audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run unit tests when present
        shell: bash
        run: |
          if compgen -G "src/utils/*.test.ts" > /dev/null; then
            npm test
          else
            echo "No src/utils unit test files are currently defined."
          fi
